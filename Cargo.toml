[workspace]
members = ["superposition_librfq", "contract"]
resolver = "3"

[workspace.dependencies]
bobcat-sdk = { version = ">=0.8.7", default-features = false, features = ["alloc", "panic-revert"] }
borsh = { version = "1.8.0", default-features = false, features = ["derive"] }
superposition-assets = { version = ">=0.4.5", features = ["borsh"] }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
