[workspace]
members = ["superposition_librfq", "contract", "cli"]
resolver = "3"

[workspace.dependencies]
bobcat-sdk = { version = ">=0.9.2", default-features = false }
borsh = { version = "1.8.0", default-features = false, features = ["derive"] }
superposition-assets = { version = ">=0.4.6", features = ["borsh"] }
const-hex = { version = ">=1.19.1", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
