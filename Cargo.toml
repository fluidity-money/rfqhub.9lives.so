[workspace]
members = ["superposition_librfq", "contract", "cli-borsh", "cli-server-signing", "cli-client-signing", "ed25519-dalek-ph"]
resolver = "3"

[workspace.dependencies]
bobcat-sdk = { version = ">=0.10.5", default-features = false, features = ["panic-revert"] }
borsh = { version = "1.8.0", default-features = false, features = ["derive"] }
superposition-assets = { version = ">=0.4.6", features = ["borsh"] }
const-hex = { version = ">=1.19.1", default-features = false }
superposition_libaccounts = { version = ">=0.10.1", default-features = false }

[patch.crates-io]
bobcat-sdk = { path = "/c/f/bobcat-sdk/bobcat-sdk" }
bobcat-cd = { path = "/c/f/bobcat-sdk/bobcat-cd" }
bobcat-maths = { path = "/c/f/bobcat-sdk/bobcat-maths" }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
