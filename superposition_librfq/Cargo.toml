[package]
name = "superposition_librfq"
version = "0.1.0"
edition = "2024"

[lib]
name = "superposition_librfq"
crate-type   = ["rlib", "cdylib"]

[dependencies]
bobcat-sdk = { workspace = true, features = ["alloc", "panic-revert", "sha512", "borsh"] }
borsh.workspace = true
superposition_libaccounts = ">=0.8.0"
superposition-assets.workspace = true
array-concat = "0.5.5"
const-hex.workspace = true
arbitrary = { version = ">=1.4.2", optional = true, features = ["derive"] }
proptest = { version = ">=1.11.0", optional = true }
proptest-derive = { version = ">=0.8.0", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[features]
std = ["bobcat-sdk/std"]
arbitrary = ["dep:arbitrary", "std", "superposition-assets/arbitrary", "bobcat-sdk/arbitrary"]
proptest = ["dep:proptest", "dep:proptest-derive", "std", "superposition-assets/proptest", "bobcat-sdk/proptest"]
serde = ["dep:serde", "bobcat-sdk/serde", "const-hex/alloc"]
arbos = []
arbitrum = []

[dev-dependencies]
proptest = ">=1.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bobcat-sdk = { workspace = true, default-features = false, features = ["alloc", "panic-revert", "sha512", "borsh", "ed25519-dalek"] }
