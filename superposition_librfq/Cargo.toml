[package]
name = "superposition_librfq"
version = "0.1.0"
edition = "2024"

[lib]
name = "superposition_librfq"
crate-type   = ["rlib", "cdylib"]

[dependencies]
bobcat-sdk.workspace = true
borsh.workspace = true
superposition_libaccounts = "0.5.0"
superposition-assets.workspace = true
array-concat = "0.5.5"
const-hex = { version = "1.19.1", default-features = false }

[features]
std = ["bobcat-sdk/std"]

[target.'cfg(not(target_arch = "wasm32"))']
bobcat-sdk = { workspace = true, features = ["ed25519-dalek"] }
